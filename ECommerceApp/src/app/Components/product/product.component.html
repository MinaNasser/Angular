<div class="d-flex justify-content-between align-items-center mb-3">
  <h4>Products</h4>
  <!-- Reset Button -->
  <button (click)="resetFilters()" class="btn btn-outline-danger">Reset Filters</button>
</div>

<!-- Add Search Bar by name -->
<div class="mb-3">
  <input type="text" [(ngModel)]="searchTerm" (input)="onSearchTermChange(searchTerm)" class="form-control"
    placeholder="Search " />
</div>

<!-- Filter by Category -->
<div class="mb-3">
  <label for="categoryFilter" class="me-2">Filter by Category:</label>
  <select [(ngModel)]="selectedCategoryID" (change)="filterProducts()" class="form-select w-auto d-inline ms-2">
    <option value="0">All Categories</option>
    <option *ngFor="let cat of Categories" [value]="cat.id">{{ cat.name }}</option>
  </select>
</div>

<!-- Sort by Price -->
<div class="mb-3">
  <label for="sortOrder" class="me-2">Sort by:</label>
  <select [(ngModel)]="sortOrder" (change)="sortProducts()" class="form-select w-auto d-inline ms-2">
    <option value="asc">Ascending</option>
    <option value="desc">Descending</option>
  </select>
</div>

<!-- Product List -->
<div class="row row-cols-1 row-cols-md-3 g-4">
  <div *ngFor="let prd of paginatedProducts; trackBy: trackByFn" class="col">
    <div class="card" appHighlightCard="gray" externalColor="pink">
      <img [src]="prd.imgUrl" class="card-img-top" [style.height.px]="300" [style.object-fit]="'cover'" alt="...">
      <div class="card-body d-flex flex-column">
        <p>ID : {{ prd.id }}</p>
        <h5 class="card-title">{{ prd.name }}</h5>
        <p class="card-text">Price : {{ prd.price | currency:'EUR': 'symbol' }}</p>
        <div [ngSwitch]="prd.quantity" class="mb-2">
          <p class="card-text text-danger text-center fs-4 fw-bold border-bottom" *ngSwitchCase="0">Out of Stock</p>
          <p class="card-text text-success fs-4 fw-bold text-center" *ngSwitchCase="1">Last Item</p>
          <p class="card-text text-success fs-4 fw-bold text-center" *ngSwitchCase="2">Last Two Items</p>
          <p class="card-text" *ngSwitchDefault>Quantity: {{ prd.quantity }}</p>
        </div>
        <div class="d-flex justify-content-between align-items-center mt-auto"
          [ngClass]="{ 'd-none': prd.quantity == 0 }">
          <input type="number" #CountInput class="form-control me-2" placeholder="Quantity" />
          <button class="btn btn-success" (click)="Buy(CountInput.value, prd.price)">Buy</button>
        </div>
        <hr>
        <button class="btn btn-success" (click)="Details(prd.id)">Details</button>
      </div>
    </div>
  </div>

  <!-- No products found message -->
  <div *ngIf="paginatedProducts.length === 0" class="col">
    <div class="card">
      <div class="card-body">
        <h5 class="card-title">No Product Found</h5>
      </div>
    </div>
  </div>
</div>

<!-- Pagination -->
<div class="d-flex justify-content-between align-items-center mt-3">
  <button class="btn btn-outline-primary" (click)="prevPage()" [disabled]="currentPage === 1">Previous</button>
  <span>Page {{ currentPage }} of {{ totalPages }}</span>
  <button class="btn btn-outline-primary" (click)="nextPage()" [disabled]="currentPage >= totalPages">Next</button>
</div>
